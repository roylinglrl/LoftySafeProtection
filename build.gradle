plugins { id 'net.neoforged.moddev' version '2.0.148' }
group='net.royling.lsp'
version='0.1.0'
base { archivesName='lofty_safe_protection-neoforge-26.2' }
java.toolchain.languageVersion=JavaLanguageVersion.of(25)
repositories {
    maven {
        url = uri('https://maven.latvian.dev/releases')
        content { includeGroup 'dev.latvian.mods'; includeGroup 'dev.latvian.apps' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'JaredMaven'
                url = uri('https://maven.blamejared.com/')
            }
        }
        filter { includeGroup 'mezz.jei' }
    }
    exclusiveContent {
        forRepository { mavenCentral() }
        filter { includeGroupByRegex 'org\\..*'; includeGroupByRegex 'com\\.google.*'; includeGroupByRegex 'io\\..*'; includeGroup 'commons-io'; includeGroup 'commons-codec'; includeGroup 'it.unimi.dsi' }
    }
}
configurations {
    localRuntime {
        canBeConsumed = false
        canBeResolved = false
    }
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly('dev.latvian.mods:kubejs-neoforge:26.1.2-8.0.8') { transitive = false }
    compileOnly('dev.latvian.mods:rhino:2101.2.8-build.91') { transitive = false }
    compileOnly("mezz.jei:jei-26.2-neoforge-api:${jei_version}")
    localRuntime("mezz.jei:jei-26.2-neoforge:${jei_version}") {
        transitive = false
    }
}

neoForge {
    version='26.2.0.93'
    runs {
        client {
            client()
            gameDirectory=file('run-client')
            programArguments.addAll '--username', 'SafeBoxDev', '--width', '1100', '--height', '720'
        }
        server { server(); programArgument '--nogui'; gameDirectory=file('run-server') }
    }
    mods { lofty_safe_protection { sourceSet sourceSets.main } }
    unitTest {
        enable()
        testedMod = mods.lofty_safe_protection
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
}
tasks.register('prepareKubeJsExamples', Copy) {
    from 'examples/kubejs'
    into 'run-client/kubejs'
}

tasks.named('runClient') { dependsOn 'prepareKubeJsExamples' }
tasks.register('prepareDevClient') { dependsOn 'classes', 'prepareClientRun', 'prepareKubeJsExamples' }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def scriptTestJars = sourceSets.main.compileClasspath.filter { it.name.startsWith('kubejs-neoforge-') || it.name.startsWith('rhino-') }

def isolatedTestClasses = new File(System.getProperty('java.io.tmpdir'),
        "${rootProject.name}-test-classes-${Integer.toHexString(projectDir.absolutePath.hashCode())}")
def stagedTestDependencies = sourceSets.test.runtimeClasspath.filter {
    it.name.endsWith('.jar') && !java.nio.charset.StandardCharsets.US_ASCII.newEncoder().canEncode(it.absolutePath)
}
tasks.register('stageTestClasses', Sync) {
    dependsOn 'testClasses'
    from(scriptTestJars.collect { zipTree(it) }) { include 'dev/**' }
    from sourceSets.main.output
    from sourceSets.test.output
    from(stagedTestDependencies) { into 'runtime' }
    into isolatedTestClasses
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    inputs.dir('examples/kubejs')
    systemProperty 'lsp.testProjectDir', projectDir.absolutePath
    dependsOn 'stageTestClasses'
    include '**/*Test.class'
    testClassesDirs = files(isolatedTestClasses)
    classpath = files(isolatedTestClasses) + files(stagedTestDependencies.elements.map { locations ->
        locations.collect { new File(isolatedTestClasses, "runtime/${it.asFile.name}") }
    }) + (sourceSets.test.runtimeClasspath - sourceSets.main.output - sourceSets.test.output - stagedTestDependencies - scriptTestJars)
}

if (project.hasProperty('startupCheck')) {
    neoForge {
        mods { lofty_safe_protection { sourceSet sourceSets.test } }
        runs.server {
            gameDirectory = file('build/startup-game')
            systemProperty 'lsp.startupCheck', 'true'
            systemProperty 'lsp.testProjectDir', projectDir.absolutePath
        }
    }
    tasks.register('prepareServerStartupCheck') {
        dependsOn 'testClasses'
        doLast {
            def game = file('build/startup-game')
            game.mkdirs()
            copy { from 'examples/kubejs'; into new File(game, 'kubejs') }
            new File(game, 'eula.txt').text = 'eula=true\n'
            new File(game, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nlevel-type=minecraft:flat\ngenerator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}],"biome":"minecraft:plains","lakes":false,"features":false}\ngenerate-structures=false\nspawn-protection=0\nmax-tick-time=-1\n'
            delete file('build/reports/server-startup/result.txt')
        }
    }
    tasks.named('runServer') { dependsOn 'prepareServerStartupCheck' }
    tasks.register('verifyServerStartup') {
        dependsOn 'runServer'
        doLast {
            def report = file('build/reports/server-startup/result.txt')
            if (!report.isFile() || !report.text.startsWith('PASS:')) throw new GradleException('Server startup verification did not pass')
        }
    }
}

dependencies { testImplementation 'org.ow2.asm:asm-tree:9.8' }
